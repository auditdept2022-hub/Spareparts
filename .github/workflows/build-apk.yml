name: Build Android APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "Code.gs"
      - "*.md"
      - "README.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm ci

      - name: Copy web app into www
        run: |
          rm -rf www
          mkdir www
          cp index.html sw.js manifest.webmanifest www/
          cp icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png favicon.png www/

      - name: Create Android project
        run: |
          npx cap add android
          cp -r android-assets/res/. android/app/src/main/res/
          npx cap sync android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Align and sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEYPASS_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "Using your own keystore from repository secrets"
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            KS="$RUNNER_TEMP/release.keystore"
            KS_PASS="$KS_PASS_SECRET"; KS_ALIAS="$KS_ALIAS_SECRET"; KEY_PASS="${KS_KEYPASS_SECRET:-$KS_PASS_SECRET}"
          else
            echo "Using the built-in keystore signing/parts-inventory.keystore"
            KS="signing/parts-inventory.keystore"
            KS_PASS="parts-inventory"; KS_ALIAS="partsinventory"; KEY_PASS="parts-inventory"
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "Input APK: $IN"
          "$BT/zipalign" -p -f 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$KS_PASS" --ks-key-alias "$KS_ALIAS" --key-pass "pass:$KEY_PASS" --out Parts-Inventory.apk aligned.apk
          "$BT/apksigner" verify --print-certs Parts-Inventory.apk
          ls -lh Parts-Inventory.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Parts-Inventory-APK
          path: Parts-Inventory.apk

      - name: Publish APK to Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Parts Inventory APK (latest)
          body: |
            Latest Android build of the Parts Inventory app.
            Download **Parts-Inventory.apk** below, open it on your phone and tap Install.
            Built from commit ${{ github.sha }} (build #${{ github.run_number }}).
          files: Parts-Inventory.apk
          make_latest: true
