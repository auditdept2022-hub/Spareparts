name: Build Android APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "Code.gs"
      - "*.md"
      - "README.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          # ubuntu-latest already ships the Android SDK; just accept licenses and add what Capacitor 6 needs
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Capacitor
        run: |
          ls -la
          test -f package.json || { echo "ERROR: package.json is missing from the repo root. Upload it next to index.html."; exit 1; }
          if [ -f package-lock.json ]; then npm ci || npm install; else npm install; fi

      - name: Copy web app into www
        run: |
          rm -rf www
          mkdir www
          cp index.html sw.js manifest.webmanifest www/
          cp icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png favicon.png www/

      - name: Create Android project
        run: |
          npx cap add android
          if [ -f android-assets.zip ]; then rm -rf android-assets; unzip -q android-assets.zip; fi
          if [ -d android-assets/res ]; then
            RES=android/app/src/main/res
            # remove Capacitor's default icon files so they can never override the Spare Parts logo
            rm -rf "$RES"/mipmap-anydpi-v26 "$RES"/drawable-v24/ic_launcher_foreground.xml "$RES"/drawable/ic_launcher_background.xml "$RES"/values/ic_launcher_background.xml
            rm -f "$RES"/mipmap-*/ic_launcher*.png
            cp -r android-assets/res/. "$RES"/
            echo "=== Logo icon files now in the Android project ==="
            find "$RES" -name "ic_launcher*" | sort
          else
            echo "ERROR: android-assets/res not found - the logo would be the default icon"; exit 1
          fi
          npx cap sync android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Align and sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEYPASS_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "Using your own keystore from repository secrets"
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            KS="$RUNNER_TEMP/release.keystore"
            KS_PASS="$KS_PASS_SECRET"; KS_ALIAS="$KS_ALIAS_SECRET"; KEY_PASS="${KS_KEYPASS_SECRET:-$KS_PASS_SECRET}"
          else
            echo "Using the built-in keystore signing/parts-inventory.keystore"
            KS="signing/parts-inventory.keystore"; [ -f "$KS" ] || KS="parts-inventory.keystore"
            KS_PASS="parts-inventory"; KS_ALIAS="partsinventory"; KEY_PASS="parts-inventory"
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "Input APK: $IN"
          "$BT/zipalign" -p -f 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$KS_PASS" --ks-key-alias "$KS_ALIAS" --key-pass "pass:$KEY_PASS" --out Parts-Inventory.apk aligned.apk
          "$BT/apksigner" verify --print-certs Parts-Inventory.apk
          ls -lh Parts-Inventory.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Parts-Inventory-APK
          path: Parts-Inventory.apk

      - name: Publish APK to Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Parts Inventory APK (latest)
          body: |
            Latest Android build of the Parts Inventory app.
            Download **Parts-Inventory.apk** below, open it on your phone and tap Install.
            Built from commit ${{ github.sha }} (build #${{ github.run_number }}).
          files: Parts-Inventory.apk
          make_latest: true
